stages:
  - test
  - dev_install
  - install
  - sonar

# The runner has no distributed cache, so every cache entry is a zip written to and read from the
# runner's own disk. The npm cache is around 136MB, and at the default level the runner spends
# longer deflating it than the download it saves.
variables:
  CACHE_COMPRESSION_LEVEL: "fastest"

# Keyed on the lockfile, so it turns over only when a dependency does. There is no webpack cache
# entry to go with it, as perun-core has: this build has no filesystem cache configured and takes
# eight seconds, which is less than zipping one would cost.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - .npm/

before_script:
  - pwd
  - echo $CI_BUILD_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

npm_test:
  cache:
    - *npm_cache
  stage: test
  script:
    - pwd
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    # Deliberately not `npm run test`. That script is
    # `eslint --fix frontend/ || exit 0`: it can never fail a pipeline, and its
    # fix pass repairs auto-fixable violations before anything can report them,
    # then after_script's reset throws the repairs away. Two real errors had
    # been sitting in frontend/ unreported because of it. The script stays in
    # package.json for local use, where fixing your working tree is the point.
    - npx eslint frontend/
    - npm run build

mvn_test:
  cache: []
  stage: test
  script:
    - cd backend
    - mvn clean
    - mvn test

prod_install:
  cache:
    - <<: *npm_cache
      policy: pull
  stage: install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - npm run build
    - cd backend
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - master
    - staging
    - dev

1_perun-core-dev-generate-js:
  cache:
    - <<: *npm_cache
      policy: pull
  stage: dev_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - npm ci --cache .npm --prefer-offline --ignore-scripts --no-audit --no-fund
    - rm -rf backend/www/*.js
    - npm run build
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add backend/www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - dev
  when: manual


sonarqube_backend:
  cache: []
  stage: sonar
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=preview -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
  when: manual

sonarqube_backend_publish:
  cache: []
  stage: sonar
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=publish -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID -Donar.gitlab.user_token access=a18878c7b5beb401ce2f847537c296b46a3902b8 
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - staging
    - dev  
  when: manual

sonarqube_frontend:
  cache: []
  stage: sonar
  script:
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=preview -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=publish -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME
  when: manual

