stages:
  - test
  - dev_install
  - install
  - sonar

before_script:
  - pwd
  - echo $CI_BUILD_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

pnpm_test:
  stage: test
  script:
    - pwd
    - git reset --hard HEAD
    # The floor is stated once, in package.json's `engines`, and read back here.
    # It is checked rather than merely declared: oxlint's native binding is an
    # optional dependency, one per platform, and a runner below the floor
    # installs without complaint and then fails inside oxlint with a
    # missing-module trace that names neither node nor the version. perun-atlas
    # met the same with vitest's bindings on its first pipeline.
    - |
      floor=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
      have=$(node -p "process.versions.node")
      if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" != "$floor" ]; then
        echo "This runner has node $have; this package needs $floor or newer."
        echo "Upgrade node on the runner rather than changing anything here."
        exit 1
      fi
      echo "ok - node $have meets the floor of $floor"
    # `npm ci` emptied node_modules itself; `pnpm install` installs over what is
    # there, so each job clears it first, here and below.
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    # `test` used to be `eslint --fix frontend/ || exit 0`, which could never
    # fail a pipeline and repaired every auto-fixable violation before a strict
    # run could see it -- so CI called eslint directly and said why. `lint` is
    # the strict run now, and the fix pass kept its own name: `lint:fix`.
    - pnpm run lint
    - pnpm run build

mvn_test:
  cache: []
  stage: test
  script:
    - cd backend
    - mvn clean
    - mvn test

prod_install:
  stage: install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - pnpm run build
    - cd backend
    - pwd
    - mvn clean deploy -DskipTests
  only:
    - master
    - staging
    - dev

1_perun-core-dev-generate-js:
  stage: dev_install
  script:  
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
    - rm -rf backend/www/*.js
    - pnpm run build
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add backend/www/*.js
    - git commit -m "Auto commit of perun-core library for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME    
  only:
    - dev
  when: manual


sonarqube_backend:
  cache: []
  stage: sonar
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=preview -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
  when: manual

sonarqube_backend_publish:
  cache: []
  stage: sonar
  script:
    - cd $CI_PROJECT_DIR/
    - cd backend
    - mvn sonar:sonar -Dsonar.analysis.mode=publish -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID -Donar.gitlab.user_token access=a18878c7b5beb401ce2f847537c296b46a3902b8 
  environment:
    name: $CI_COMMIT_REF_NAME
  only:
    - staging
    - dev  
  when: manual

sonarqube_frontend:
  cache: []
  stage: sonar
  script:
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=preview -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME -Dsonar.gitlab.commit_sha=$CI_BUILD_REF -Dsonar.gitlab.ref_name=$CI_BUILD_REF_NAME -Dsonar.gitlab.project_id=$CI_PROJECT_ID
    - sonar-scanner -Dsonar.sources=. -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.analysis.mode=publish -Dsonar.login=a02003f1f8f90382d7570b57a85c00c38132f85f -Dsonar.branch=$CI_BUILD_REF_NAME -Dsonar.projectName=$CI_PROJECT_NAME
  when: manual

