# pnpm 9 reads this file as a workspace definition alone and refuses it without
# a packages list. pnpm 10 and 11, which also read their settings from here,
# accept it either way. Empty is accurate: there are no sub-packages.
packages: []

# Subdependencies carrying advisories their parents pin too tightly to fix on
# their own: monaco-editor, through perun-core, asks for dompurify 3.4.8
# exactly, and the sockjs webpack-dev-server brings asks for an old uuid.
# Neither reaches the shipped bundle -- perun-core is external, and the dev
# server is not in it -- so these clear the audit and protect the dev machine
# rather than changing what ships.
#
# pnpm 11 reads overrides from here; pnpm 9 and 10 read them from the "pnpm"
# field of package.json. Both are declared, and must be kept in step.
overrides:
  dompurify: ^3.4.15
  uuid: ^11.1.1
